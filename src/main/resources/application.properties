spring.application.name=expense-tracker-api

# In-memory H2 Datenbank (kein Setup noetig, ideal zum Ausprobieren)
spring.datasource.url=jdbc:h2:mem:expensesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Server
server.port=8080

# OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.info.title=Expense Tracker API
springdoc.info.description=Verwaltet und aggregiert Ausgaben ueber eine REST-API.
springdoc.info.version=0.1.0
springdoc.info.license.name=MIT
